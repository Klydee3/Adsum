<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
		<title>Adsum</title>
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("theme")==="light"?"light":"dark");}catch(e){}</script>
		<link rel="stylesheet" href="style.css">
		<link rel="icon" type="image/png" href="icon.png">
	</head>
	<body>
		<div id="app"></div>
		<template data-page="index.html" data-title="Adsum">
        <div class="container">
			<div class="bubble">
				<h1>Вход в аккаунт</h1>
				<input class="name-input" id="login-input" type="text" placeholder="ФИО">
				<input class="name-input" id="password-input" type="password" placeholder="Пароль">
				<button class="btn btn-yes" id="login-btn">Войти</button>
				<button class="btn" id="to-reg-btn">Регистрация (если вы не ученик)</button>
				<p id="message"></p>
			</div>
		</div>
    
		</template>

		<template data-page="admin.html" data-title="Adsum: Кабинет администрации">
		<div class="container">
			<h1>Кабинет администрации</h1>
			<p id="message"></p>
		</div>
	
		</template>

		<template data-page="applications.html" data-title="Adsum: Заявки на аккаунты">
		<div class="container container-wide">
			<h1>Заявки на аккаунты</h1>
			<div id="pending-accounts" class="card-grid"></div>
			<button class="btn" id="back-btn">Назад</button>
			<p id="message"></p>
		</div>
	
		</template>

		<template data-page="assign.html" data-title="Классные руководители">
    <div class="container container-wide">
        <h1>Классные руководители</h1>
        <div id="teachers-box" class="card-grid"></div>
        <button class="btn" id="back-btn">Назад</button>
        <p id="message"></p>
    </div>
		</template>

		<template data-page="cafeteria.html" data-title="Adsum: Кабинет Школьной столовой">
		<div class="container">
			<h1>Кабинет Школьной столовой</h1>
			<p id="message"></p>
		</div>
	
		</template>

		<template data-page="change.html" data-title="Adsum: Смена пароля">
        <div class="container">
            <h1>Смена пароля</h1>
			<div class="bubble">
				<input class="name-input" id="old-pass" type="password" placeholder="Текущий пароль">
				<input class="name-input" id="new-pass" type="password" placeholder="Новый пароль (минимум 8 символов)">
				<div class="select-row">
					<button class="btn change-btn" id="change-btn">Сменить пароль</button>
					<button class="btn" id="back-btn">Назад</button>
				</div>
			</div>
            <p id="message"></p>
        </div>
    
		</template>

		<template data-page="delete-account.html" data-title="Adsum: Удаление аккаунта">
		<div class="container">
			<h1>Удаление аккаунта</h1>
			<div class="bubble">
				<h1>Внимание!</h1>
				<p> Аккаунт будет удалён без возможности восстановления. Для ученика также удаляется запись из списков школы, для учителя — назначение классным руководителем. Журнал посещаемости и оценок сохраняется.</p>
				<input class="name-input" id="password-input" type="password" placeholder="Введите пароль для подтверждения">
				<div class="select-row">
					<button class="btn btn-no" id="delete-btn">Удалить аккаунт</button>
					<button class="btn" id="back-btn">Назад</button>
				</div>
			</div>
			<p id="message"></p>
		</div>
	
		</template>

		<template data-page="diary.html" data-title="Adsum: Электронный дневник">
		<div class="container container-wide">
			<h1>Электронный дневник</h1>
			<div class="toolbar">
				<button class="btn" id="prev-week">Предыдущая неделя</button>
				<input type="date" id="diary-date">
				<button class="btn" id="next-week">Следующая неделя</button>
			</div>
			<p id="diary-range"></p>
			<div id="diary-days" class="card-grid"></div>
			<div class="bubble wide">
				<h3>Средние оценки</h3>
				<div id="diary-averages"></div>
			</div>
			<p id="message"></p>
			<button class="btn" id="back-btn">Назад</button>
		</div>
	
		</template>

		<template data-page="developer.html" data-title="Adsum: Кабинет Главного Разработчика">
		<div class="container">
			<h1>Кабинет Главного Разработчика</h1>
			<p id="message"></p>
		</div>
	
		</template>

		<template data-page="journal.html" data-title="Adsum: Журнал оценок">
		<div class="container">
			<h1>Журнал оценок</h1>
			<p id="message"></p>
			<div class="bubble wide" id="school-box" style="display:none">
				<label for="school-select">Школа</label>
				<select id="school-select"></select>
			</div>
			<div class="bubble wide">
				<label for="journal-class">Класс</label>
				<select id="journal-class"></select>
				<label for="journal-subject">Предмет</label>
				<input id="journal-subject" list="subjects" type="text" maxlength="60" placeholder="Например: Математика">
				<datalist id="subjects"></datalist>
				<label>Дата</label>
				<input type="date" id="journal-date">
				<button class="btn btn-yes" id="load-btn">Показать класс</button>
			</div>
			<div class="bubble wide" id="journal-box" style="display:none">
				<h3>Домашнее задание</h3>
				<input id="journal-homework" type="text" maxlength="300" placeholder="Что задано на эту дату (пусто — удалить задание)">
				<h3>Оценки (1–10)</h3>
				<div id="journal-list"></div>
				<button class="btn btn-yes" id="save-btn">Сохранить</button>
			</div>
			<button class="btn" id="back-btn">Назад</button>
		</div>
	
		</template>

		<template data-page="menu.html" data-title="Adsum: Школьное меню">
		<div class="container">
			<h1>Школьное меню</h1>
			<div class="bubble wide" id="school-box" style="display:none">
				<label for="school-select">Школа</label>
				<select id="school-select"></select>
			</div>
			<div class="toolbar">
				<input type="date" id="menu-date">
				<button class="btn btn-yes" id="show-btn">Показать</button>
			</div>
			<p id="message"></p>
			<div id="menu-view"></div>
			<button class="btn" id="back-btn">Назад</button>
		</div>
	
		</template>

		<template data-page="reasons.html" data-title="Adsum: Причины отсутствующих">
	<div class="container">
			<h1>Причины отсутствующих</h1>
			<p id="reasons-date"></p>
			<div id="reasons-list"></div>
			<button class="btn" id="back-btn">Назад</button>
			<p id="message"></p>
		</div>
		</template>

		<template data-page="reg-admin.html" data-title="Adsum: Кабинет регистрации администраторов школ">
		<div class="container">
			<h1>Введите необходимую информацию для регистрации ниже:</h1>
			<div class="bubble">
				<input class="name-input" id="register-surname" type="text" placeholder="Введите фамилию администратора">
				<input class="name-input" id="register-name" type="text" placeholder="Введите имя администратора">
				<input class="name-input" id="register-patronymic" type="text" placeholder="Введите отчество администратора">
				<input class="name-input" id="register-password-input" type="password" placeholder="Введите пароль администратора">
				<div class="select-group">
					<label for="school">Выберите школу:</label>
					<input list="schools" id="register-school" name="school" placeholder="Полное наименование УО">
					<datalist id="schools"></datalist>
				</div>
				<button class="btn btn-yes" id="regAdmin">Зарегистрировать</button>
			</div>
			<p id="message"></p>
		</div>
	
		</template>

		<template data-page="reg-page.html" data-title="Adsum">
	<div class="container">
		<div id="reg-screen">
			<h1>Регистрация</h1>
			<div class="bubble">
				<input class="name-input" id="register-surname" type="text" placeholder="Фамилия">
				<input class="name-input" id="register-name" type="text" placeholder="Имя">
				<input class="name-input" id="register-patronymic" type="text" placeholder="Отчество">
				<input class="name-input" id="register-password-input" type="password" placeholder="Пароль">
				<input class="name-input" id="register-password-input-repeat" type="password" placeholder="Повторите пароль">
				<div class="select-row">
					<div class="select-group">
						<label for="school">Выберите школу:</label>
						<input list="schools" id="register-school" name="school" placeholder="Полное наименование УО">
						<datalist id="schools"></datalist>
					</div>
					<div class="select-group">
						<label for="role">Кто вы?</label>
						<select id="role" name="role-choise">
							<option value="TEACHER">Учитель</option>
							<option value="ADMIN">Администрация</option>
							<option value="CAFETERIA">Столовая</option>
						</select>
					</div>
				</div>
				<button class="btn" id="register-btn">Создать аккаунт</button>
				<button class="btn" id="back-btn">Назад</button>
				<p id="message"></p>
			</div>
		</div>
	</div>
		</template>

		<template data-page="register-student.html" data-title="Adsum: Регистрация ученика">
    <div class="container">
        <h1>Регистрация ученика</h1>
		<div class="bubble">
			<input class="name-input" id="reg-surname" type="text" placeholder="Фамилия">
			<input class="name-input" id="reg-name" type="text" placeholder="Имя">
			<input class="name-input" id="reg-patronymic" type="text" placeholder="Отчество">
			<input class="name-input" id="reg-class" type="text" placeholder="Класс">
			<input class="name-input" id="reg-school" list="schools" type="text" placeholder="Школа (только для главного разработчика)" style="display:none">
			<datalist id="schools"></datalist>
			<div class="select-row">
				<button class="btn" id="reg-student-btn">Зарегистрировать ученика</button>
				<button class="btn" id="back-btn">Назад</button>
			</div>
		</div>
        <p id="message"></p>
    </div>
		</template>

		<template data-page="set-school-menu.html" data-title="Adsum: Установка школьного меню">
		<div class="container">
			<h1>Школьное меню</h1>
			<p id="message"></p>
			<div class="bubble wide" id="school-box" style="display:none">
				<label for="school-select">Школа</label>
				<select id="school-select"></select>
			</div>
			<div class="bubble wide">
				<h3>Новый питательный комплекс</h3>
				<label for="complex-name">Название</label>
				<input id="complex-name" type="text" maxlength="60" placeholder="Например: Комплекс 1">
				<label for="complex-dishes">Блюда (каждое с новой строки)</label>
				<textarea id="complex-dishes" rows="6" placeholder="Суп&#10;Картофельное пюре&#10;Котлета&#10;Компот"></textarea>
				<button class="btn" id="add-complex-btn">Добавить комплекс</button>
			</div>
			<div class="bubble wide">
				<h3>Меню на день</h3>
				<label>Дата</label>
				<input type="date" id="menu-date">
				<p>Отметьте комплексы, которые будут в этот день:</p>
				<div id="complex-list"></div>
				<button class="btn" id="save-menu-btn">Сохранить меню на день</button>
			</div>
			<button class="btn" id="back-btn">Назад</button>
		</div>
	
		</template>

		<template data-page="settings.html" data-title="Adsum: Настройки">
		<div class="container">
			<h1>Настройки</h1>
			<div class="bubble">
				<h3>Тема оформления</h3>
				<div class="theme-switch" role="group" aria-label="Тема оформления">
					<button type="button" id="theme-dark" aria-pressed="true">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Тёмная
					</button>
					<button type="button" id="theme-light" aria-pressed="false">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>Светлая
					</button>
				</div>
			</div>
			<div class="bubble">
				<h3>Аккаунт</h3>
				<div class="select-complex">
					<button class="btn" id="change-pass-btn">Смена пароля</button>
					<button class="btn" id="logout-btn">Выход из аккаунта</button>
				</div>
				<div class="select-complex">
					<button class="btn btn-no" id="delete-account-btn">Удаление аккаунта</button>
				</div>
			</div>
			<p id="message"></p>
		</div>
	
		</template>

		<template data-page="student-list.html" data-title="Adsum: Список учеников">
        <div class="container container-wide">
            <h1>Список учеников</h1>
            <div id="all-list" class="card-grid"></div>
            <button class="btn" id="back-btn">Назад</button>
            <p id="message"></p>
        </div>
    
		</template>

		<template data-page="student.html" data-title="Adsum: Кабинет ученика">
		<div class="container">
			<h1>Кабинет ученика</h1>
			<div class="bubble">
				<h3>Будете сегодня в школе?</h3>
				<div class="select-complex">
					<button class="btn btn-yes" id="btn-yes">Да, буду</button>
					<button class="btn btn-no" id="btn-no">Нет</button>
				</div>
				<input class="name-input" id="reason-input" type="text" placeholder="Причина отсутствия, если не придёте">
			</div>
			<p id="message"></p>
		</div>
	
		</template>

		<template data-page="summary.html" data-title="Adsum: Утренняя сводка">
	<div class="container">
		<h1>Утренняя сводка</h1>
		<div class="toolbar">
			<input type="date" id="summary-date">
			<button class="btn btn-yes" id="show-btn">Показать</button>
			<button class="btn" id="csv-btn">Скачать CSV</button>
			<button class="btn" id="reasons-btn">Причины отсутствующих</button>
		</div>
		<div class="table-wrap">
		<table id="summary-table">
			<thead>
				<tr><th>Класс</th><th>Всего</th><th>Пришло</th><th>Не пришло</th><th>Не отметилось</th><th>Процент</th></tr>
			</thead>
			<tbody></tbody>
		</table>
		</div>
		<p id="summary-total"></p>
		<p id="message"></p>
		<button class="btn" id="back-btn">Назад</button>
	</div>
		</template>

		<template data-page="teacher.html" data-title="Adsum: Кабинет учителя">
		<div class="container">
			<h1>Кабинет учителя</h1>
			<p id="message"></p>
		</div>
	
		</template>

		<script src="layout.js"></script>
		<script src="pages.js"></script>
	</body>
</html>
