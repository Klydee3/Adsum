<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="UTF-8">
		<title>Adsum: Удаление аккаунта</title>
		<link rel="stylesheet" href="style.css">
		<link rel="icon" type="image/png" href="icon.png">
	</head>
	<body>
		<div class="container">
			<h1>Удаление аккаунта</h1>
			<div class="bubble">
				<h1>Внимание!</h1>
				<p> Аккаунт будет удалён без возможности восстановления. Для ученика также удаляется запись из списков школы, для учителя — назначение классным руководителем. Журнал посещаемости сохраняется.</p>
				<input class="name-input" id="password-input" type="password" placeholder="Введите пароль для подтверждения">
				<div class="select-row">
					<button class="btn btn-no" id="delete-btn">Удалить аккаунт</button>
					<button class="btn" id="back-btn">Назад</button>
				</div>
			</div>
			<p id="message"></p>
		</div>
		<script src="layout.js"></script>
		<script src="delete-account.js"></script>
	</body>
</html>
